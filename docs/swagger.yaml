definitions:
  DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  Endpoint:
    properties:
      id:
        type: integer
      name:
        description: Nome do recurso, único e não nulo
        type: string
    required:
    - id
    - name
    type: object
  H:
    additionalProperties: {}
    type: object
  HTTPError:
    properties:
      message:
        type: string
    type: object
  PersonType:
    enum:
    - FISICA
    - JURIDICA
    type: string
    x-enum-varnames:
    - Fisica
    - Juridica
  PolicyRole:
    properties:
      actions:
        type: string
      endpoint:
        $ref: '#/definitions/Endpoint'
      endpoint_id:
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/Role'
        description: // constraints
      role_id:
        type: integer
    required:
    - actions
    - endpoint_id
    - role_id
    type: object
  PolicyUser:
    properties:
      actions:
        type: string
      endpoint:
        $ref: '#/definitions/Endpoint'
      endpoint_id:
        type: integer
      user:
        allOf:
        - $ref: '#/definitions/User'
        description: // constraints
      user_id:
        type: string
    required:
    - actions
    - endpoint_id
    - user_id
    type: object
  Role:
    properties:
      id:
        type: integer
      name:
        description: Nome do recurso, único e não nulo
        type: string
      policies:
        items:
          $ref: '#/definitions/PolicyRole'
        type: array
    required:
    - id
    - name
    type: object
  StatusType:
    enum:
    - ATIVO
    - INATIVO
    type: string
    x-enum-varnames:
    - Ativo
    - Inativo
  Tenant:
    properties:
      allowed_origins:
        items:
          type: integer
        type: array
      api_key:
        type: string
      cell_phone:
        type: string
      cep:
        type: string
      city:
        type: string
      complement:
        type: string
      cpf_cnpj:
        type: string
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/DeletedAt'
      email:
        type: string
      id:
        type: string
      ie:
        type: string
      name:
        type: string
      neighborhood:
        type: string
      number:
        type: string
      phone:
        type: string
      state:
        type: string
      status:
        $ref: '#/definitions/StatusType'
      street:
        type: string
      type:
        $ref: '#/definitions/PersonType'
      updated_at:
        type: string
    required:
    - name
    - status
    - type
    type: object
  TenantRedis:
    properties:
      cpfcnpj:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  Token:
    properties:
      policies:
        items:
          type: string
        type: array
      refreshToken:
        type: string
      roles:
        items:
          type: string
        type: array
      token:
        type: string
      type:
        type: string
      user:
        $ref: '#/definitions/TokenUser'
    type: object
  TokenUser:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      thumbnail:
        type: string
      username:
        type: string
    type: object
  User:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/DeletedAt'
      email:
        type: string
      id:
        type: string
      name:
        type: string
      policies:
        items:
          $ref: '#/definitions/PolicyUser'
        type: array
      roles:
        items:
          $ref: '#/definitions/Role'
        type: array
      tenant:
        allOf:
        - $ref: '#/definitions/Tenant'
        description: constraints
      thumbnail:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  UserCreate:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      tenant_id:
        type: string
      username:
        type: string
    type: object
host: http://localhost:5001
info:
  contact:
    name: Go Base API Support
    url: https://github.com/jeancarlosdanese/go-base-api
  description: API REST base com autenticação JWT, RBAC (Casbin), multi-tenancy, rate
    limiting (Redis) e métricas Prometheus. Template completo para desenvolvimento
    de APIs Go com arquitetura limpa.
  license:
    name: MIT
    url: https://github.com/jeancarlosdanese/go-base-api/blob/main/LICENSE
  termsOfService: https://github.com/jeancarlosdanese/go-base-api/blob/main/LICENSE
  title: Go Base API
  version: 1.0.0
paths:
  /api/v1/auth-apikey/tenant-by-apikey:
    get:
      consumes:
      - application/json
      description: Busca Tenant por X-API-Key
      produces:
      - application/json
      responses:
        "200":
          description: Tenant
          schema:
            $ref: '#/definitions/TenantRedis'
        "400":
          description: Invalid X-API-Key format
          schema:
            $ref: '#/definitions/HTTPError'
        "404":
          description: Tenant not found
          schema:
            $ref: '#/definitions/HTTPError'
      summary: Busca Tenant por X-API-Key
      tags:
      - auth-apikey
  /api/v1/auth/login:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Loga um usuário usando email e senha. Retorna access token e refresh
        token
      parameters:
      - description: Email do Usuário
        in: formData
        name: email
        required: true
        type: string
      - description: Senha do Usuário
        in: formData
        name: password
        required: true
        type: string
      - description: 'Origem da requisição (ex: localhost, example.com)'
        in: header
        name: Origin
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Token gerado com sucesso
          schema:
            $ref: '#/definitions/Token'
        "400":
          description: Erro de autenticação - parâmetros inválidos ou origem não fornecida
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Credenciais inválidas
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Loga um usuário
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Renova o access token usando o refresh token. Retorna novos access
        token e refresh token
      parameters:
      - description: Refresh Token válido
        in: formData
        name: refreshToken
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Token renovado com sucesso
          schema:
            $ref: '#/definitions/Token'
        "400":
          description: Parâmetros inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Token inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Renova o token
      tags:
      - Auth
  /api/v1/tenants:
    get:
      consumes:
      - application/json
      description: Busca todos os Tenants (requer permissão de administração)
      produces:
      - application/json
      responses:
        "200":
          description: Lista de Tenants
          schema:
            items:
              $ref: '#/definitions/Tenant'
            type: array
        "401":
          description: Token não fornecido ou inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "403":
          description: Permissão negada
          schema:
            $ref: '#/definitions/HTTPError'
        "500":
          description: Erro Interno do Servidor
          schema:
            $ref: '#/definitions/HTTPError'
      security:
      - Bearer: []
      summary: Busca todos os Tenants
      tags:
      - Tenants
    post:
      consumes:
      - application/json
      description: Adiciona um novo Tenant ao sistema com API Key gerada automaticamente
        (requer permissão de administração)
      parameters:
      - description: Informações do Tenant
        in: body
        name: tenant
        required: true
        schema:
          $ref: '#/definitions/Tenant'
      produces:
      - application/json
      responses:
        "201":
          description: Tenant Criado com API Key
          schema:
            $ref: '#/definitions/Tenant'
        "400":
          description: Erro de Formato de Solicitação
          schema:
            $ref: '#/definitions/HTTPError'
        "401":
          description: Token não fornecido ou inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "403":
          description: Permissão negada
          schema:
            $ref: '#/definitions/HTTPError'
        "500":
          description: Erro Interno do Servidor
          schema:
            $ref: '#/definitions/HTTPError'
      security:
      - Bearer: []
      summary: Cria um novo Tenant
      tags:
      - Tenants
  /api/v1/tenants/{id}:
    delete:
      consumes:
      - application/json
      description: Exclui um Tenant com base no ID fornecido (requer permissão de
        administração)
      parameters:
      - description: Tenant ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Mensagem de sucesso
          schema:
            $ref: '#/definitions/H'
        "400":
          description: ID Inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "401":
          description: Token não fornecido ou inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "403":
          description: Permissão negada
          schema:
            $ref: '#/definitions/HTTPError'
        "500":
          description: Erro Interno do Servidor
          schema:
            $ref: '#/definitions/HTTPError'
      security:
      - Bearer: []
      summary: Exclui um Tenant
      tags:
      - Tenants
    get:
      consumes:
      - application/json
      description: Busca Tenant por ID (requer permissão de administração)
      parameters:
      - description: Tenant ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Tenant encontrado
          schema:
            $ref: '#/definitions/Tenant'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/HTTPError'
        "401":
          description: Token não fornecido ou inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "403":
          description: Permissão negada
          schema:
            $ref: '#/definitions/HTTPError'
        "404":
          description: Tenant not found
          schema:
            $ref: '#/definitions/HTTPError'
      security:
      - Bearer: []
      summary: Busca Tenant por ID
      tags:
      - Tenants
    patch:
      consumes:
      - application/json
      description: Atualiza parcialmente um Tenant existente com base no ID fornecido
        (PATCH) (requer permissão de administração)
      parameters:
      - description: Tenant ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Campos a serem atualizados (JSON parcial)
        in: body
        name: tenant
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Tenant Atualizado
          schema:
            $ref: '#/definitions/Tenant'
        "400":
          description: ID Inválido ou Erro de Formato de Solicitação
          schema:
            $ref: '#/definitions/HTTPError'
        "401":
          description: Token não fornecido ou inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "403":
          description: Permissão negada
          schema:
            $ref: '#/definitions/HTTPError'
        "404":
          description: Tenant not found
          schema:
            $ref: '#/definitions/HTTPError'
        "500":
          description: Erro Interno do Servidor
          schema:
            $ref: '#/definitions/HTTPError'
      security:
      - Bearer: []
      summary: Atualiza parcialmente um Tenant existente
      tags:
      - Tenants
    put:
      consumes:
      - application/json
      description: Atualiza completamente um Tenant existente com base no ID fornecido
        (PUT) (requer permissão de administração)
      parameters:
      - description: Tenant ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Dados completos do Tenant
        in: body
        name: tenant
        required: true
        schema:
          $ref: '#/definitions/Tenant'
      produces:
      - application/json
      responses:
        "200":
          description: Tenant Atualizado
          schema:
            $ref: '#/definitions/Tenant'
        "400":
          description: ID Inválido ou Erro de Formato de Solicitação
          schema:
            $ref: '#/definitions/HTTPError'
        "401":
          description: Token não fornecido ou inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "403":
          description: Permissão negada
          schema:
            $ref: '#/definitions/HTTPError'
        "404":
          description: Tenant not found
          schema:
            $ref: '#/definitions/HTTPError'
        "500":
          description: Erro Interno do Servidor
          schema:
            $ref: '#/definitions/HTTPError'
      security:
      - Bearer: []
      summary: Atualiza um Tenant existente
      tags:
      - Tenants
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: Busca todos os Users do tenant autenticado
      produces:
      - application/json
      responses:
        "200":
          description: Lista de Users
          schema:
            items:
              $ref: '#/definitions/User'
            type: array
        "401":
          description: Token não fornecido ou inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "500":
          description: Erro Interno do Servidor
          schema:
            $ref: '#/definitions/HTTPError'
      security:
      - Bearer: []
      summary: Busca todos os Users
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: Adiciona um novo User ao sistema no tenant autenticado
      parameters:
      - description: Informações do User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/UserCreate'
      produces:
      - application/json
      responses:
        "201":
          description: User Criado
          schema:
            $ref: '#/definitions/User'
        "400":
          description: Erro de Formato de Solicitação
          schema:
            $ref: '#/definitions/HTTPError'
        "401":
          description: Token não fornecido ou inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "500":
          description: Erro Interno do Servidor
          schema:
            $ref: '#/definitions/HTTPError'
      security:
      - Bearer: []
      summary: Cria um novo User
      tags:
      - Users
  /api/v1/users/{id}:
    delete:
      consumes:
      - application/json
      description: Exclui um User com base no ID fornecido do tenant autenticado
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Mensagem de sucesso
          schema:
            $ref: '#/definitions/H'
        "400":
          description: ID Inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "401":
          description: Token não fornecido ou inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "500":
          description: Erro Interno do Servidor
          schema:
            $ref: '#/definitions/HTTPError'
      security:
      - Bearer: []
      summary: Exclui um User
      tags:
      - Users
    get:
      consumes:
      - application/json
      description: Busca User por ID do tenant autenticado
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User encontrado
          schema:
            $ref: '#/definitions/User'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/HTTPError'
        "401":
          description: Token não fornecido ou inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/HTTPError'
      security:
      - Bearer: []
      summary: Busca User por ID
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Atualiza parcialmente um User existente com base no ID fornecido
        (PATCH)
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Campos a serem atualizados (JSON parcial)
        in: body
        name: user
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: User Atualizado
          schema:
            $ref: '#/definitions/User'
        "400":
          description: ID Inválido ou Erro de Formato de Solicitação
          schema:
            $ref: '#/definitions/HTTPError'
        "401":
          description: Token não fornecido ou inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/HTTPError'
        "500":
          description: Erro Interno do Servidor
          schema:
            $ref: '#/definitions/HTTPError'
      security:
      - Bearer: []
      summary: Atualiza parcialmente um User existente
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Atualiza completamente um User existente com base no ID fornecido
        (PUT)
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Dados completos do User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/User'
      produces:
      - application/json
      responses:
        "200":
          description: User Atualizado
          schema:
            $ref: '#/definitions/User'
        "400":
          description: ID Inválido ou Erro de Formato de Solicitação
          schema:
            $ref: '#/definitions/HTTPError'
        "401":
          description: Token não fornecido ou inválido
          schema:
            $ref: '#/definitions/HTTPError'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/HTTPError'
        "500":
          description: Erro Interno do Servidor
          schema:
            $ref: '#/definitions/HTTPError'
      security:
      - Bearer: []
      summary: Atualiza um User existente
      tags:
      - Users
  /health:
    get:
      consumes:
      - application/json
      description: Verifica o status de saúde da aplicação e suas dependências (PostgreSQL
        e Redis)
      produces:
      - application/json
      responses:
        "200":
          description: 'Sistema saudável - status: ok'
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 'Sistema degradado - status: degraded (algum serviço indisponível)'
          schema:
            additionalProperties: true
            type: object
      summary: Health check da aplicação
      tags:
      - System
  /metrics:
    get:
      consumes:
      - application/json
      description: Expõe métricas da aplicação no formato Prometheus para scraping
      produces:
      - text/plain
      responses:
        "200":
          description: Métricas Prometheus em formato texto
          schema:
            type: string
      summary: Métricas Prometheus
      tags:
      - System
securityDefinitions:
  Bearer:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
